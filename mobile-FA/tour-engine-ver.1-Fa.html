                            </use>
                          </svg>
                        </button>

                        <ul id="tour-menu-@catid"
                          class="tour-menu hidden-box hidden fixed inset-0 w-full h-full list-none space-y-1.5 p-2 bg-white min-w-64 overflow-auto z-50">
                          <div
                            class="close-passenger-box w-5 h-5 leading-5 mb-4 clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
                            onclick="close_passenger(this)">
                            <svg width="15" height="15" class="align-middle">
                              <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
                            </svg>
                          </div>
                          @child
                        </ul>
                      </div>
                    </face>
                    <face level="end" filter="link is null">
                      <li class="tour-item">
                        <button onclick="SelectPlaceModule(this)" data-link="/tour-list.bc?catid=@catid"
                          class="w-full text-right flex items-center gap-3 px-3 py-2 rounded-lg
                                                         text-zinc-700 hover:text-zinc-900 hover:bg-zinc-50 transition cursor-pointer">
                          <svg width="15" height="15" class="align-middle">
                            <use xlink:href="/images/sprite-icons-mobile.svg#engine-submenu-icon">
                            </use>
                          </svg>
                          <span class="truncate">@title</span>
                        </button>
                      </li>
                    </face>
                    <face level="end">
                      <li class="tour-item">
                        <button onclick="SelectPlaceModule(this)" data-link="/@link"
                          class="w-full text-right flex items-center gap-3 px-3 py-2 rounded-lg
                                                         text-zinc-700 hover:text-zinc-900 hover:bg-zinc-50 transition cursor-pointer">
                          <svg width="15" height="15" class="align-middle">
                            <use xlink:href="/images/sprite-icons-mobile.svg#engine-submenu-icon">
                            </use>
                          </svg>
                          <span class="truncate">@title</span>
                        </button>
                      </li>
                    </face>
                  </basis>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </basis>

</div>
