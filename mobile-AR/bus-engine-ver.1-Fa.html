<input type="hidden" class="bus-module" value="[##cms.Host.bus-module##]" />
<div id="r-bus" class="r-bus module-form relative hidden" data-module="bus">
  <ul class="bustype-items bustype-items-ul w-full clear-both mb-3 flex gap-1 hidden">
    <li id="oneway-bus"
      class="active-r-btn group inline-block leading-6 cursor-pointer text-base border-type-1 h-full rounded-type-1">
      <label for="bustype-oneway">
        <input type="radio" id="bustype-oneway" name="bustype" value="oneway" class="hidden" checked>
        <span class="cursor-pointer text-sm text-textColor px-2 group-hover:text-primary">یک طرفه</span>
      </label>
    </li>
    <li id="backtoback-bus"
      class="group inline-block leading-6 cursor-pointer text-base border-type-1 h-full rounded-type-1">
      <label for="bustype-btb">
        <input type="radio" id="bustype-btb" name="bustype" value="backtoback" class="hidden">
        <span class="cursor-pointer text-sm text-textColor px-2 group-hover:text-primary">رفت و برگشت</span>
      </label>
    </li>
    <div class="clr"></div>
  </ul>
  <div class="close-module-form w-1/4 h-6 mb-4 cursor-pointer" onclick="close_module_form(this)">
    <svg class="rightarrow-icon align-middle" width="24" height="24">
      <use xlink:href="images/sprite-icons-mobile.svg#engine-rightarrow-icon"></use>
    </svg>
    <span>اتوبوس</span>
  </div>
  <form action="bus/search" method="post" data-form="bus" data-schema="391" data-bustype="1" id="busSearch"
    onsubmit="form_search_isSubmited(this,event,true)" class="form-search formbus">
    <input type="hidden" name="persiancurrent" class="persiancurrent" value="" />
    <div class="block">
      <div class="bus-routes w-full block">
        <div class="reserve-field departure-route h-20 relative w-full mb-4">
          <div onclick="empty_value(this)"
            class="click-content cursor-pointer border-type-1 h-full rounded-type-1 px-2">
            <label class="label-routes label-departure-bus float-right w-full cursor-pointer relative"
              for="departureBus">
              <svg width="15" height="19" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-departurebus-icon"></use>
              </svg>
              <span class="label-text text-sm">مبدا</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor cursor-pointer">تهران</p>
            <input id="departureBus" type="text"
              class="departure text-value line-clamp--1 text-textColor w-full cursor-pointer relative bg-inherit text-base"
              required="" aria-label="departure" autocomplete="off" value="تهران - Tehran"
              placeholder="مبدا خود را انتخاب کنید" />
          </div>
          <input value="1203548" class="locationId from" type="hidden" name="from" aria-label="locationId" />
          <div
            class="searchList hidden-box hidden py-3.5 px-4 border-type-1 rounded-type-1 min-w-full float-right text-sm absolute z-50 clear-both top-full right-0  bg-white text-right leading-6 w-full">
            <div class="w-full flex items-center justify-between mb-4">
              <div class="float-right px-2 text-xs h-fit py-2 relative rounded-lg text-primary label-search-list">
                <span class="z-10">انتخاب مبدا</span>
              </div>
              <div
                class="close-searchList bg-primary h-fit px-3 rounded-lg py-2 leading-5   clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
                onclick="close_searchList(this)">
                <svg width="15" height="15" class=" hidden">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
                </svg>
                <span class="text-white close-text"> تایید و بستن</span>
              </div>
            </div>
            <div class="flex relative mb-2 float-right w-full clear-both">
              <div class="h-9 leading-9">
                <svg width="15" height="19" class="align-middle">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-location-icon"></use>
                </svg>
              </div>
              <input type="text" aria-label="reserve-location" placeholder="مبدا" oninput="city_search(this)"
                data-type="3"
                class="reserve-location form-search-input h-9 leading-9 pr-3 bg-transparent text-right text-base"
                autocomplete="off" value="" />
            </div>
            <span class="mini-loading absolute hidden top-14 left-4" aria-label="spinner">
              <svg class="spinner-label-icon align-middle" width="15" height="19">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-spinner-icon"></use>
              </svg>
            </span>
            <div class="locationResult clear-both"></div>
            <div class="load-location-options"></div>
          </div>
          <span
            class="exchangeRoute absolute left-1 z-[1] cursor-pointer w-10 h-10 leading-10 text-center rounded-type-2 text-white bg-bgColor-500 hover:bg-primary rotate-90 top-[65px]"
            data-index="0" onclick="ExchangeRoute_Bus(this)">
            <svg width="15" height="11" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-exchange-icon"></use>
            </svg>
          </span>
        </div>
        <div class="reserve-field destination-route h-20 relative w-full mb-4">
          <div onclick="empty_value(this)"
            class="click-content border-type-1 cursor-pointer h-full rounded-type-1 px-2">
            <label class="label-routes label-destination-bus float-right w-full cursor-pointer relative"
              for="destinationBus">
              <svg width="15" height="19" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-destinationbus-icon"></use>
              </svg>
              <span class="label-text text-sm">مقصد</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor cursor-pointer">استانبول</p>
            <input id="destinationBus" type="text"
              class="destination text-value line-clamp--1 text-textColor w-full cursor-pointer relative bg-inherit text-base"
              required="" aria-label="destination" autocomplete="off" value="استانبول - Istanbul"
              placeholder="مقصد خود را انتخاب کنید" />
          </div>
          <input value="1177676" class="locationId to" type="hidden" name="to" aria-label="locationId" />
          <div
            class="searchList hidden-box hidden py-3.5 px-4 border-type-1 rounded-type-1 min-w-full float-right text-sm absolute z-50 clear-both top-full right-0  bg-white text-right leading-6 w-full">
            <div class="w-full flex items-center justify-between mb-4">
              <div class="float-right px-2 h-fit py-2 relative text-xs rounded-lg text-primary  label-search-list">
                <span class="z-10">انتخاب مقصد</span>
              </div>
              <div
                class="close-searchList bg-primary px-3 rounded-lg py-2 leading-5   clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
                onclick="close_searchList(this)">
                <svg width="15" height="15" class=" hidden">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
                </svg>
                <span class="text-white close-text"> تایید و بستن</span>
              </div>
            </div>
            <div class="flex relative mb-2 float-right w-full clear-both">
              <div class="h-9 leading-9">
                <svg width="15" height="19" class="align-middle">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-location-icon"></use>
                </svg>
              </div>
              <input type="text" aria-label="reserve-location" placeholder="مقصد" oninput="city_search(this)"
                data-type="3"
                class="reserve-location form-search-input h-9 leading-9 pr-3 bg-transparent text-right text-base"
                autocomplete="off" value="" />
            </div>
            <span class="mini-loading absolute hidden top-14 left-4" aria-label="spinner">
              <svg class="spinner-label-icon align-middle" width="15" height="19">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-spinner-icon"></use>
              </svg>
            </span>
            <div class="locationResult clear-both"></div>
            <div class="load-location-options"></div>
          </div>
        </div>
      </div>
      <div class="date__searched__container Basis_Date_Box flex gap-2 w-full mb-4">
        <div class="reserve-field departure-date w-full h-20 relative">
          <div class="border-type-1 h-full rounded-type-1 px-2">
            <label class="label-dates label-fdate-bus float-right w-full relative" for="fromdateBus">
              <svg width="15" height="15" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-departurecalendar-icon"></use>
              </svg>
              <span class="label-text text-sm">تاریخ رفت</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor"><span class="selected-day"></span><span
                class="selected-month"></span></p>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='simple'">
              <input type="text" aria-label="تاریخ رفت" value=""
                class="Basis_Date start_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                onclick="Basis_Calendar(this,'[##cms.cms.date##]', 1)" data-lang="fa" data-active="0" data-cache="0"
                readonly="" name="fdate" id="fromdateBus" required="" placeholder="تاریخ" />
            </basis>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='multi'">
              <input type="text" aria-label="تاریخ رفت" value="" data-role="depart"
                class="js-date-input departure__date  Basis_Date start_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                readonly="" name="fdate" id="fromdateBus" required="" placeholder="تاریخ" />
              <input value="" class="mstring_date mstring_fdate" type="hidden" aria-label="mstring_fdate" />
            </basis>
            <div class="clr"></div>
          </div>
        </div>
        <div class="reserve-field return-date w-1/2 h-20 relative no-activedate hidden">
          <div class="border-type-1 h-full rounded-type-1 px-2">
            <label class="label-dates label-tdate-bus float-right w-full relative" for="todateBus">
              <svg width="15" height="15" class="align-middle">
                <use xlink:href="images/sprite-icons.svg#engine-returncalendar-icon"></use>
              </svg>
              <span class="label-text text-sm">تاریخ برگشت</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor"><span class="selected-day"></span><span
                class="selected-month"></span></p>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='simple'">
              <input type="text" aria-label="تاریخ برگشت" value=""
                class="Basis_Date end_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 text-sm px-2 max-xl:text-base"
                onclick="Basis_Calendar(this,'[##cms.cms.date##]', 1)" data-lang="fa" data-active="0" data-cache="0"
                readonly="" name="tdate" id="todateBus" required="" placeholder="تاریخ برگشت" disabled />
            </basis>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='multi'">
              <input type="text" aria-label="تاریخ برگشت" value="" data-role="return"
                class="js-date-input arrival__date Basis_Date end_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 text-sm px-2 max-xl:text-base"
                readonly="" name="tdate" id="todateBus" required="" placeholder="تاریخ برگشت" disabled />
              <input value="" class="mstring_date mstring_tdate" type="hidden" aria-label="mstring_tdate" />
            </basis>
            <div class="clr"></div>
          </div>
        </div>
      </div>
      <div class="reserve-search flex items-center justify-center gap-2 h-20 w-full">
        <button type="submit"
          class="search-bus flex items-center justify-center gap-2 w-full h-full m-auto px-3 rounded-type-1 bg-bgColor-100 cursor-pointer hover:bg-secondary"><span>جستجو</span>
          <svg width="32" height="33" class="align-middle">
            <use xlink:href="images/sprite-icons-mobile.svg#engine-search-icon"></use>
          </svg>
        </button>
      </div>
    </div>
  </form>
</div>
