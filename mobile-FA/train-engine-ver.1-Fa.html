<input type="hidden" class="train-module" value="[##cms.Host.train-module##]" />
<div id="r-train" class="r-train module-form relative hidden" data-module="train">
  <div class="close-module-form w-1/4 h-6 mb-4 cursor-pointer" onclick="close_module_form(this)">
    <svg class="rightarrow-icon align-middle" width="24" height="24">
      <use xlink:href="images/sprite-icons-mobile.svg#engine-rightarrow-icon"></use>
    </svg>
    <span>قطار</span>
  </div>
  <ul class="book-module__type traintype-items w-full clear-both mb-3 flex gap-1">
    <li id="oneway-train"
      class="book-active__module__type active-r-btn group inline-block leading-6 cursor-pointer text-base border-type-1 h-full rounded-type-1">
      <label for="traintype-oneway">
        <input type="radio" id="traintype-oneway" name="traintype" value="oneway" class="hidden" checked>
        <span class="cursor-pointer text-sm text-textColor px-2 group-hover:text-primary">یک طرفه</span>
      </label>
    </li>
    <li id="backtoback-train"
      class="group inline-block leading-6 cursor-pointer text-base border-type-1 h-full rounded-type-1">
      <label for="traintype-btb">
        <input type="radio" id="traintype-btb" name="traintype" value="backtoback" class="hidden">
        <span class="cursor-pointer text-sm text-textColor px-2 group-hover:text-primary">رفت و برگشت</span>
      </label>
    </li>
    <div class="clr"></div>
  </ul>
  <form action="/Tem3_Train_Oneway_Search.bc?lid=1" method="post" data-form="train" data-trainType="1" id="trainSearch"
    onsubmit="form_search_isSubmited(this,event)" class="form-search formtrain">
    <input type="hidden" name="persiancurrent" class="persiancurrent" value="" />
    <input type="hidden" value="0" name="select-age" class="select-age-value" aria-label="select-age" />
    <div class="block">
      <div class="train-routes w-full block">
        <div class="reserve-field h-20 departure-route relative w-full mb-4">
          <div onclick="empty_value(this)"
            class="click-content border-type-1 cursor-pointer h-full rounded-type-1 px-2">
            <label class="label-routes label-departure-train float-right w-full cursor-pointer relative"
              for="departure10">
              <svg width="15" height="19" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-departuretrain-icon"></use>
              </svg>
              <span class="label-text text-sm">مبدا</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor cursor-pointer">تهران</p>
            <input id="departure10" name="departure" type="text"
              class="departure text-value line-clamp--1 text-textColor w-full cursor-pointer relative bg-inherit text-base"
              required="" aria-label="departure" autocomplete="off" value="تهران - Tehran - همه فرودگاه ها"
              placeholder="مبدا خود را انتخاب کنید" />
          </div>
          <input value="1203548" class="locationId from" type="hidden" name="from" aria-label="locationId" />
          <div
            class="searchList hidden-box hidden py-3.5 px-4 border-type-1 rounded-type-1 min-w-full float-right text-sm absolute z-50 clear-both top-full right-0  bg-white text-right leading-6 w-full">
            <div class="w-full flex items-center justify-between mb-4">
              <div class="float-right px-2 text-xs h-fit py-2 relative rounded-lg text-primary label-search-list">
                <span class="z-10">انتخاب مبدا</span>
              </div>
              <div
                class="close-searchList bg-primary h-fit px-3 rounded-lg py-2 leading-5   clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
                onclick="close_searchList(this)">
                <svg width="15" height="15" class=" hidden">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
                </svg>
                <span class="text-white close-text"> تایید و بستن</span>
              </div>
            </div>
            <div class="flex relative mb-2 float-right w-full clear-both">
              <div class="h-9 leading-9">
                <svg width="15" height="19" class="align-middle">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-location-icon"></use>
                </svg>
              </div>
              <input type="text" aria-label="reserve-location" placeholder="مبدا" oninput="city_search(this)"
                data-type="3"
                class="reserve-location form-search-input h-9 leading-9 pr-3 bg-transparent text-right text-base"
                autocomplete="off" value="" />
            </div>
            <span class="mini-loading absolute hidden top-14 left-4" aria-label="spinner">
              <svg class="spinner-label-icon align-middle" width="15" height="19">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-spinner-icon"></use>
              </svg>
            </span>
            <div class="locationResult clear-both"></div>
            <div class="load-location-options"></div>
          </div>
          <span
            class="exchangeRoute absolute left-1 z-[1] cursor-pointer w-10 h-10 leading-10 text-center rounded-type-2 text-white bg-bgColor-500 hover:bg-primary rotate-90 top-[65px]"
            data-index="0" onclick="ExchangeRoute_Train(this)">
            <svg width="15" height="11" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-exchange-icon"></use>
            </svg>
          </span>
        </div>
        <div class="reserve-field h-20 destination-route relative w-full mb-4">
          <div onclick="empty_value(this)"
            class="click-content border-type-1 cursor-pointer h-full rounded-type-1 px-2">
            <label class="label-routes label-destination-train float-right w-full cursor-pointer relative"
              for="destination10">
              <svg width="15" height="19" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-destinationtrain-icon"></use>
              </svg>
              <span class="label-text text-sm">مقصد</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor cursor-pointer">استانبول</p>
            <input id="destination10" name="destination" type="text"
              class="destination text-value line-clamp--1 text-textColor w-full cursor-pointer relative bg-inherit text-base"
              required="" aria-label="destination" autocomplete="off" value="استانبول - Istanbul - همه فرودگاه ها"
              placeholder="مقصد خود را انتخاب کنید" />
          </div>
          <input value="1177676" class="locationId to" type="hidden" name="to" aria-label="locationId" />
          <div
            class="searchList hidden-box hidden py-3.5 px-4 border-type-1 rounded-type-1 min-w-full float-right text-sm absolute z-50 clear-both top-full right-0  bg-white text-right leading-6 w-full">
            <div class="w-full flex items-center justify-between mb-4">
              <div class="float-right px-2 h-fit py-2 relative text-xs rounded-lg text-primary  label-search-list">
                <span class="z-10">انتخاب مقصد</span>
              </div>
              <div
                class="close-searchList bg-primary px-3 rounded-lg py-2 leading-5   clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
                onclick="close_searchList(this)">
                <svg width="15" height="15" class=" hidden">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
                </svg>
                <span class="text-white close-text"> تایید و بستن</span>
              </div>
            </div>
            <div class="flex relative mb-2 float-right w-full clear-both">
              <div class="h-9 leading-9">
                <svg width="15" height="19" class="align-middle">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-destination-icon"></use>
                </svg>
              </div>
              <input type="text" aria-label="reserve-location" placeholder="مقصد" oninput="city_search(this)"
                data-type="3"
                class="reserve-location form-search-input h-9 leading-9 pr-3 bg-transparent text-right text-base"
                autocomplete="off" value="" />
            </div>
            <span class="mini-loading absolute hidden top-14 left-4" aria-label="spinner">
              <svg class="spinner-label-icon align-middle" width="15" height="19">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-spinner-icon"></use>
              </svg>
            </span>
            <div class="locationResult clear-both"></div>
            <div class="load-location-options"></div>
          </div>
        </div>
      </div>
      <div class="date__searched__container Basis_Date_Box flex gap-2 w-full mb-4">
        <div class="reserve-field departure-date w-1/2 h-20 relative">
          <div class="border-type-1 h-full rounded-type-1 px-2">
            <label class="label-dates label-fdate-train float-right w-full relative" for="fromdate10">
              <svg width="15" height="15" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-departurecalendar-icon"></use>
              </svg>
              <span class="label-text text-sm">تاریخ رفت</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor"><span class="selected-day"></span><span
                class="selected-month"></span></p>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='simple'">
              <input type="text" aria-label="تاریخ رفت" value=""
                class="Basis_Date start_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                onclick="Basis_Calendar(this,'[##cms.cms.date##]', 1)" data-lang="fa" data-active="0" data-cache="0"
                readonly="" name="fdate" id="fromdate10" required="" placeholder="تاریخ رفت" />
            </basis>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='multi'">
              <input type="text" aria-label="تاریخ رفت" value="" data-role="depart"
                class="js-date-input departure__date Basis_Date start_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                readonly="" name="fdate" id="fromdate10" required="" placeholder="تاریخ رفت" />
              <input value="" class="mstring_date mstring_fdate" type="hidden" aria-label="mstring_fdate" />
            </basis>
            <div class="clr"></div>
          </div>
        </div>
        <div class="reserve-field return-date w-1/2 h-20 relative no-activedate">
          <div class="border-type-1 h-full rounded-type-1 px-2">
            <label class="label-dates label-tdate-train float-right w-full relative" for="todate10">
              <svg width="15" height="15" class="align-middle">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-returncalendar-icon"></use>
              </svg>
              <span class="label-text text-sm">تاریخ برگشت</span>
              <svg class="down-icon float-left align-middle mt-2 absolute left-0 top-0 h-2 hidden" width="15"
                height="8">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
              </svg>
            </label>
            <p class="auto-fit clear-both text-base text-textColor"><span class="selected-day"></span><span
                class="selected-month"></span></p>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='simple'">
              <input type="text" aria-label="تاریخ برگشت" value=""
                class="Basis_Date end_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                onclick="Basis_Calendar(this,'[##cms.cms.date##]', 1)" data-lang="fa" data-active="0" data-cache="0"
                readonly="" name="tdate" id="todate10" required="" placeholder="تاریخ برگشت" disabled />
            </basis>
            <basis core="group" name="calendar-type-simple" if="'[##cms.Host.calendar-type##]'='multi'">
              <input type="text" aria-label="تاریخ برگشت" value="" data-role="return"
                class="js-date-input arrival__date Basis_Date end_date text-textColor cursor-pointer h-full pt-12 w-full text-right bg-inherit leading-6 float-right absolute top-0 right-0 px-2 text-base"
                readonly="" name="tdate" id="todate10" required="" placeholder="تاریخ برگشت" disabled />
              <input value="" class="mstring_date mstring_tdate" type="hidden" aria-label="mstring_tdate" />
            </basis>
            <div class="clr"></div>
          </div>
        </div>
      </div>
      <div class="reserve-field Compartment-field w-auto h-20 relative w-full mb-4">
        <div onclick="show_Compartment(this)" class="border-type-1 cursor-pointer h-full rounded-type-1 px-2">
          <label class="label-compartment label-compartment-train float-right w-full cursor-pointer" for="Compartment1">
            <svg width="15" height="11" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-compartment-icon"></use>
            </svg>
            <span class="label-text text-sm">نوع کابین</span>
            <svg class="down-icon h-full float-left align-middle mt-2" width="15" height="8">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
            </svg>
          </label>
          <input type="hidden" name="CompartmentType" value="3" class="Compartment-value" id="Compartment1" />
          <span class="Compartment-text float-right cursor-pointer">خانواده</span>
          <div class="clr"></div>
        </div>
        <div class="Compartment hidden-box hidden bg-white w-full clear-both py-3.5 px-4">
          <div
            class="close-searchList w-5 h-5 leading-5 mb-4 clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
            onclick="close_Compartment(this)">
            <svg width="15" height="15" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
            </svg>
          </div>
          <ul>
            <li class="active-Compartment group leading-8 text-right cursor-pointer text-base hover:text-primary"
              data-value="3" onclick="select_Compartment(this)">
              <label
                class="label-compartmentitem label-compartmentitem-train cursor-pointer text-sm text-textColor group-hover:text-primary">مسافر
                عادی (خانواده)</label>
            </li>
            <li class="group leading-8 cursor-pointer text-base hover:text-primary" data-value="1"
              onclick="select_Compartment(this)">
              <label
                class="label-compartmentitem label-compartmentitem-train cursor-pointer text-sm text-textColor group-hover:text-primary">ویژه
                خواهران</label>
            </li>
            <li class="group leading-8 cursor-pointer text-base hover:text-primary" data-value="2"
              onclick="select_Compartment(this)">
              <label
                class="label-compartmentitem label-compartmentitem-train cursor-pointer text-sm text-textColor group-hover:text-primary">ویژه
                برادران</label>
            </li>
          </ul>
          <div class="clr"></div>
        </div>
      </div>
      <div class="reserve-field passengers-field h-20 relative w-full mb-4">
        <div onclick="show_passengerbox(this)"
          class="show-passengers-dropdown show-passengers-dropdown-train border-type-1 cursor-pointer h-full rounded-type-1 px-2">
          <label class="label-passengers label-passengers-train float-right w-full cursor-pointer" for="passenger1">
            <svg width="15" height="15" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-passenger-icon"></use>
            </svg>
            <span class="label-text text-sm">تعداد مسافران</span>
            <svg class="down-icon h-full float-left align-middle mt-2" width="15" height="8">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-down-icon"></use>
            </svg>
          </label>
          <div class="cursor-pointer">
            <span class="passenger-counts adult-count inline-block text-textColor h-6 leading-6 text-sm"><span
                class="count min-w-3 inline-block">1</span> بزرگسال</span><span
              class="passenger-counts child-count inline-block text-textColor h-6 leading-6 text-sm mr-2 hidden"><span
                class="count min-w-3 inline-block">0</span> کودک</span>
          </div>
        </div>
        <div class="passengerbox hidden-box hidden bg-white w-full py-3.5 px-4">
          <div
            class="close-passenger-box w-5 h-5 leading-5 mb-4 clear-both text-center text-textColor cursor-pointer text-sm float-left hover:text-red-600"
            onclick="close_passenger(this)">
            <svg width="15" height="15" class="align-middle">
              <use xlink:href="images/sprite-icons-mobile.svg#engine-close-icon"></use>
            </svg>
          </div>
          <div class="passenger-item adult-passenger-item clear-both w-full mb-4 relative">
            <label for="passenger-adultcount10"
              class="label-passengeradult label-passengeradult-train float-right text-sm leading-8 text-textColor"><span
                class="adult-tlt-icon ml-1 hidden"><svg class="align-middle" width="15" height="15">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-adult-icon"></use>
                </svg></span><span>بزرگسال</span><span class="exp-age text-grays-400 mr-2">(12 سال به
                بالا)</span></label>
            <ul class="float-left h-8 leading-8">
              <li
                class="plus-count inline-block w-8 h-8 leading-8 text-center hover:text-primary radius-type-1 border-type-1 cursor-pointer">
                <div class="h-full leading-8" onclick="Change_AdultCount_Flight(this)"><span
                    class="count-icon-simple">+</span><span class="count-icon-svg hidden"><svg class="align-middle"
                      width="10" height="10">
                      <use xlink:href="images/sprite-icons-mobile.svg#engine-plus-icon"></use>
                    </svg></span></div>
              </li>
              <li class="inline-block w-8 h-8 leading-8 text-center hover:text-primary"><input
                  id="passenger-adultcount10" type="text" class="adultcount w-full text-center text-base" name="adult"
                  maxlength="4000" value="1" readonly></li>
              <li
                class="minus-count inline-block w-8 h-8 leading-8 text-center hover:text-primary radius-type-1 border-type-1 cursor-pointer">
                <div class="h-full leading-8" onclick="Change_AdultCount_Flight(this)"><span
                    class="count-icon-simple">-</span><span class="count-icon-svg hidden"><svg class="align-middle"
                      width="10" height="10">
                      <use xlink:href="images/sprite-icons-mobile.svg#engine-minus-icon"></use>
                    </svg></span></div>
              </li>
            </ul>
            <div class="clr"></div>
          </div>
          <div class="passenger-item child-passenger-item clear-both w-full mb-4 relative">
            <label for="passenger-childcount10"
              class="label-passengerchild label-passengerchild-train float-right text-sm leading-8 text-textColor"><span
                class="child-tlt-icon ml-1 hidden"><svg class="align-middle" width="15" height="15">
                  <use xlink:href="images/sprite-icons-mobile.svg#engine-child-icon"></use>
                </svg></span><span>کودک</span><span class="exp-age text-grays-400 mr-2">(0 تا 12 سال)</span></label>
            <input type="hidden" value="0" class="childcountinput text-base" name="child" aria-label="childcount">
            <ul class="float-left h-8 leading-8">
              <li
                class="plus-count inline-block w-8 h-8 leading-8 text-center hover:text-primary radius-type-1 border-type-1 cursor-pointer">
                <div class="h-full leading-8" onclick="Change_ChildCount_Flight(this)"><span
                    class="count-icon-simple">+</span><span class="count-icon-svg hidden"><svg class="align-middle"
                      width="10" height="10">
                      <use xlink:href="images/sprite-icons-mobile.svg#engine-plus-icon"></use>
                    </svg></span></div>
              </li>
              <li class="inline-block w-8 h-8 leading-8 text-center hover:text-primary"><input
                  id="passenger-childcount10" type="text" class="childcount w-full text-center text-base"
                  maxlength="4000" value="0" readonly></li>
              <li
                class="minus-count inline-block w-8 h-8 leading-8 text-center hover:text-primary radius-type-1 border-type-1 cursor-pointer">
                <div class="h-full leading-8" onclick="Change_ChildCount_Flight(this)"><span
                    class="count-icon-simple">-</span><span class="count-icon-svg hidden"><svg class="align-middle"
                      width="10" height="10">
                      <use xlink:href="images/sprite-icons-mobile.svg#engine-minus-icon"></use>
                    </svg></span></div>
              </li>
            </ul>
            <div class="clr"></div>
          </div>
          <div class="section-select-age clear-both"></div>
          <div
            class="confirm-passenger hidden w-full h-8 leading-8 text-center hover:text-primary radius-type-1 border-type-1 cursor-pointer text-sm clear-both"
            onclick="close_passenger(this)"><span class="confirmpass-tlt-icon ml-1 hidden"><svg class="align-middle"
                width="15" height="15">
                <use xlink:href="images/sprite-icons-mobile.svg#engine-confirmpass-icon"></use>
              </svg></span><span>تایید</span></div>
          <div class="clr"></div>
        </div>
      </div>
      <div class="reserve-search w-auto h-20 w-full">
        <button type="submit"
          class="search-train flex items-center justify-center gap-2 w-full h-full m-auto px-3 rounded-type-1 bg-bgColor-100 cursor-pointer hover:bg-secondary"><span>جستجو</span>
          <svg width="32" height="33" class="align-middle">
            <use xlink:href="images/sprite-icons-mobile.svg#engine-search-icon"></use>
          </svg>
        </button>
      </div>
    </div>
    <div class="reserve-field PrivateCompartment-field mb-4 mt-5 clear-both float-right w-full">
      <div class="Wrapper-PrivateCompartment">
        <input class="PrivateCompartment cursor-pointer opacity-0 absolute text-base" type="checkbox" value="0"
          onchange="CheckPrivateCompartment(this)" name="PrivateCompartment" id="PrivateCompartment"
          aria-label="PrivateCompartment" />
        <label class="PrivateCompartment-label text-sm relative pr-7" for="PrivateCompartment">کوپه دربست</label>
      </div>
    </div>
  </form>
</div>
